syntax = "proto3";

package polyuma.wire.v1;

message UmaBatch {
  uint32 schema_version = 1;
  uint64 batch_sequence = 2;
  uint64 sent_at_us = 3;
  repeated UmaEvent events = 4;
}

message UmaEvent {
  uint64 sequence = 1;
  EventType event_type = 2;
  uint64 block_number = 3;
  bytes transaction_hash = 4;
  uint32 log_index = 5;

  uint64 market_id = 6;
  bytes condition_id = 7;
  repeated bytes token_ids = 8;
  repeated uint32 tag_ids = 9;

  bytes price_raw = 10;
  bytes requester = 11;
  bytes proposer = 12;
  bytes disputer = 13;
  uint64 upstream_received_at_us = 14;
  bytes block_hash = 15;
  bool removed = 16;
  EnrichmentStatus enrichment_status = 17;

  bytes contract_address = 18;
  bytes identifier = 19;
  uint64 request_timestamp = 20;
  bytes question_id = 21;
  string question = 22;
  string resolution_p1 = 23;
  string resolution_p2 = 24;
  string resolution_p3 = 25;
  string resolution_p4 = 26;
  bytes initializer = 27;
  uint64 expiration_timestamp = 28;
  bytes currency = 29;
  optional uint32 transaction_index = 30;
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_PROPOSE = 1;
  EVENT_TYPE_DISPUTE = 2;
}

enum EnrichmentStatus {
  ENRICHMENT_STATUS_UNSPECIFIED = 0;
  ENRICHMENT_STATUS_HIT = 1;
  ENRICHMENT_STATUS_MISS = 2;
}
