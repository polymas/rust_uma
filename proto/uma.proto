syntax = "proto3";

package polyuma.wire.v1;

message UmaBatch {
  uint32 schema_version = 1;
  uint64 batch_sequence = 2;
  uint64 sent_at_us = 3;
  repeated UmaEvent events = 4;
}

// Trimmed to what a downstream trader actually needs to act (which token,
// which direction) plus the minimum to dedupe/resume/audit. Everything else
// (block metadata, participant addresses, the human-readable question and
// resolution text, ...) is reconstructable from `transaction_hash` via any
// Polygon RPC or the Gamma API — this service does not duplicate it onto
// every single WSS frame.
//
// No production consumer exists yet, so field numbers here are free to
// renumber/reshuffle at will — once something depends on this wire format,
// switch to additive-only changes (new field numbers, never reuse a retired
// one) per docs/WORKFLOW.md "升级".
message UmaEvent {
  uint64 sequence = 1;
  EventType event_type = 2;
  bytes transaction_hash = 3;
  uint32 log_index = 4;

  uint64 market_id = 5;
  bytes condition_id = 6;
  // Both outcome tokens for this (binary) condition. Which one to act on is
  // `price_outcome` below — deliberately not collapsed to a single token_id,
  // since a downstream position/hedge may still need the other side.
  repeated bytes token_ids = 7;
  repeated uint32 tag_ids = 8;

  uint64 upstream_received_at_us = 9;
  bool removed = 10;
  EnrichmentStatus enrichment_status = 11;

  // Which `token_ids` entry this event's on-chain price resolves to.
  // Derived from the UMA OO price (0 / 0.5e18 / 1e18) via the CTF adapter's
  // own payout formula (verified against UmaCtfAdapter.sol's
  // `_constructPayouts`, `// Payouts: [YES, NO]`): price==1e18 -> payouts[0]
  // -> token_ids[0]; price==0 -> payouts[1] -> token_ids[1]; price==0.5e18 is
  // a tie, no token wins. This is a protocol-level invariant, independent of
  // the market's own outcome labels (Yes/No, Over/Under, ...) — no ancillary
  // text parsing required downstream.
  //
  // Only meaningful for EVENT_TYPE_PROPOSE. A DisputePrice's on-chain price
  // is the *contested* value being challenged, not a fresh answer — for
  // EVENT_TYPE_DISPUTE this is always PRICE_OUTCOME_UNSPECIFIED, and
  // consumers must treat any prior propose-derived decision for this
  // condition_id as no longer trustworthy until a new propose arrives.
  PriceOutcome price_outcome = 12;

  // Both derived once at enrichment time (see `category::classify` and
  // `Catalog::compact_market`) from Gamma's own `tags`/`sportsMarketType`/
  // `question` fields — never from on-chain data. Both are
  // *_UNSPECIFIED whenever enrichment missed (same "miss is a miss" rule as
  // token_ids/tag_ids above), and BetType is always BET_TYPE_UNSPECIFIED
  // unless Category is CATEGORY_SPORTS/CATEGORY_ESPORTS/CATEGORY_WEATHER —
  // the bet-type taxonomy only applies to those.
  Category category = 13;
  BetType bet_type = 14;
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_PROPOSE = 1;
  EVENT_TYPE_DISPUTE = 2;
}

enum EnrichmentStatus {
  ENRICHMENT_STATUS_UNSPECIFIED = 0;
  ENRICHMENT_STATUS_HIT = 1;
  ENRICHMENT_STATUS_MISS = 2;
}

enum PriceOutcome {
  PRICE_OUTCOME_UNSPECIFIED = 0;
  PRICE_OUTCOME_TOKEN0 = 1;
  PRICE_OUTCOME_TOKEN1 = 2;
  PRICE_OUTCOME_TIE = 3;
}

// Top-level market category. Derived from Gamma tag IDs — see
// `category::classify` and `config/category_rules.json`.
enum Category {
  CATEGORY_UNSPECIFIED = 0;
  CATEGORY_SPORTS = 1;
  CATEGORY_ESPORTS = 2;
  CATEGORY_POLITICS = 3;
  CATEGORY_CRYPTO = 4;
  CATEGORY_CULTURE = 5;
  CATEGORY_WEATHER = 6;
  CATEGORY_OTHER = 7; // known tag(s), but none matched a category above
}

// Bet-type sub-classification, only meaningful when Category is
// CATEGORY_SPORTS/CATEGORY_ESPORTS/CATEGORY_WEATHER. Derived primarily from
// Gamma's own `sportsMarketType`/tag fields, falling back to the market
// `question` text when those are absent — see `category::classify`.
//
// Values are `CCCBBB` decimal-encoded: a 3-digit *bet-type group* (CCC,
// 1-999) times 1000, plus a 3-digit sub-type index within that group (BBB,
// 001-999) — e.g. 1001, 1002, ..., 2001, 2002. This is deliberately NOT the
// same number as the paired Category enum's own value — Sports and Esports
// are two different Category values but share one bet-type group (1xxx)
// because the bet-type vocabulary (moneyline/spread/...) is identical for
// both; a literal `bet_type / 1000 == category` derivation would force
// duplicating every sports bet type under a second, redundant Esports-only
// block for no semantic gain. Groups are hand-assigned in this comment, not
// computed from anything:
//   0     shared (BET_TYPE_UNSPECIFIED)
//   1xxx  Sports + Esports
//   2xxx  Weather
//   3xxx  next bettable Category, if one is ever added, then 4xxx, ...
// Each group carries its own catch-all ("known category, no specific bucket
// fit" — BET_TYPE_SPORTS_PROP / BET_TYPE_WEATHER_OTHER) rather than sharing
// one cross-group value, so "every BetType for group X falls in X's 1000s"
// holds with no exceptions. Headroom (999 groups x 999 sub-types) is large
// enough that this numbering never needs to change shape — adding a bettable
// Category is always just picking the next unused `Nxxx`, never a
// renumbering of anything already shipped.
enum BetType {
  BET_TYPE_UNSPECIFIED = 0;

  // Group 1xxx: Sports + Esports
  BET_TYPE_MONEYLINE = 1001; // single-game/match win-loss (incl. period-scoped)
  BET_TYPE_SPREAD = 1002; // point spread / handicap
  BET_TYPE_OVER_UNDER = 1003; // totals (points, corners, ...)
  BET_TYPE_GAME_WINNER = 1004; // one game/map/set within a best-of series
  BET_TYPE_OUTRIGHT = 1005; // championship/tournament winner futures
  BET_TYPE_SPORTS_PROP = 1006; // known sports/esports bet, no more specific bucket fit
  // 1007-1999 reserved for future Sports/Esports bet types.

  // Group 2xxx: Weather
  BET_TYPE_TEMP_HIGH = 2001; // daily high temperature
  BET_TYPE_TEMP_LOW = 2002; // daily low temperature
  BET_TYPE_PRECIPITATION = 2003; // snow/rain
  BET_TYPE_STORM = 2004; // hurricane/tropical storm
  BET_TYPE_WEATHER_OTHER = 2005; // known weather bet, no more specific bucket fit
  // 2006-2999 reserved for future Weather bet types (wind, air quality, ...).
}
