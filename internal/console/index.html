<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uma console</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0f14; --panel: #121821; --border: #1f2733;
    --text: #d8e1ea; --dim: #7c8a9a; --ok: #3ecf8e; --warn: #e8b339; --bad: #e5534b; --accent: #5aa9ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: 20px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  h2 { font-size: 13px; font-weight: 600; margin: 24px 0 8px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
  #meta { color: var(--dim); font-size: 12px; }
  #meta.err { color: var(--bad); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; }
  .card .k { color: var(--dim); font-size: 11px; }
  .card .v { font-size: 18px; font-weight: 600; margin-top: 2px; word-break: break-all; }
  .card .s { color: var(--dim); font-size: 11px; margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: top; }
  th { color: var(--dim); font-weight: 500; font-size: 11px; }
  tr:last-child td { border-bottom: 0; }
  .wrap { overflow-x: auto; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .dim { color: var(--dim); }
  .badge { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 11px; border: 1px solid currentColor; }
  button { background: transparent; color: var(--accent); border: 1px solid var(--border); border-radius: 4px;
    padding: 2px 8px; font: inherit; font-size: 11px; cursor: pointer; margin-right: 4px; }
  button:hover { border-color: var(--accent); }
  button.danger { color: var(--bad); }
  input { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 3px 6px; font: inherit; }
  #adminbar { display: flex; gap: 8px; align-items: center; margin: 10px 0 0; color: var(--dim); font-size: 12px; flex-wrap: wrap; }
  #secret { background: var(--panel); border: 1px solid var(--warn); border-radius: 6px; padding: 10px 12px; margin: 10px 0; display: none; }
  #secret code { color: var(--warn); user-select: all; word-break: break-all; }
  .empty { color: var(--dim); padding: 10px 12px; }
</style>
</head>
<body>
<h1>uma console</h1>
<div id="meta">loading…</div>
<div id="adminbar">
  <span>admin token</span>
  <input id="admin" type="password" size="28" placeholder="管理动作需要">
  <button id="saveadmin">保存到本机</button>
  <span id="adminstate"></span>
</div>
<div id="secret"></div>

<h2>tinyuma（法兰克福）</h2>
<div class="cards" id="upstream"></div>

<h2>edge 节点（香港）</h2>
<div class="wrap"><table><thead><tr>
  <th>node</th><th>status</th><th>clients</th><th>seq lag</th><th>上游延迟 last/max</th><th>帧/字节</th>
  <th>slow</th><th>fanout max</th><th>upstream</th><th>url</th><th>ver</th><th>心跳</th><th>备注</th><th></th>
</tr></thead><tbody id="nodes"></tbody></table></div>

<h2>下游 token</h2>
<div id="adminbar2" style="margin:0 0 8px">
  <input id="newname" placeholder="新 token 名称" size="24">
  <button id="create">创建 token</button>
</div>
<div class="wrap"><table><thead><tr>
  <th>id</th><th>name</th><th>prefix</th><th>status</th><th>clients</th><th>分布</th><th>created</th><th></th>
</tr></thead><tbody id="tokens"></tbody></table></div>

<script>
(function () {
  const qs = new URLSearchParams(location.search);
  const token = qs.get('token') || '';
  const $ = (id) => document.getElementById(id);
  let adminToken = '';
  try { adminToken = localStorage.getItem('uma_console_admin') || ''; } catch (e) {}
  $('admin').value = adminToken;
  $('saveadmin').onclick = () => {
    adminToken = $('admin').value.trim();
    try { localStorage.setItem('uma_console_admin', adminToken); } catch (e) {}
    $('adminstate').textContent = adminToken ? '已保存' : '已清除';
  };
  const getAdmin = () => ($('admin').value.trim() || adminToken);

  const fmtNum = (n) => (n == null ? '-' : Number(n).toLocaleString('en-US'));
  const fmtUs = (us) => (us == null ? '-' : us >= 1e6 ? (us / 1e6).toFixed(2) + 's' : us >= 1000 ? (us / 1000).toFixed(1) + 'ms' : us + 'µs');
  const fmtBytes = (b) => (b >= 1 << 30 ? (b / (1 << 30)).toFixed(2) + 'G' : b >= 1 << 20 ? (b / (1 << 20)).toFixed(1) + 'M' : b >= 1024 ? (b / 1024).toFixed(0) + 'K' : b + 'B');
  const ago = (ms, now) => (ms ? ((now - ms) / 1000).toFixed(1) + 's 前' : '-');
  const ts = (ms) => (ms ? new Date(ms).toISOString().replace('T', ' ').slice(0, 19) : '-');
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const statusClass = (s) => ({ serving: 'ok', full: 'warn', not_ready: 'warn', draining: 'warn', disabled: 'dim', stale: 'bad' }[s] || '');

  function card(k, v, s, cls) {
    return `<div class="card"><div class="k">${esc(k)}</div><div class="v ${cls || ''}">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
  }

  function renderUpstream(p) {
    const u = p.upstream || {};
    const h = u.healthz || {};
    const d = u.dashboard || {};
    const cards = [];
    cards.push(card('连接', u.ok ? '<span class="ok">ok</span>' : `<span class="bad">失败</span>`, esc(u.error || u.base_url), ''));
    cards.push(card('抓取', ago(u.fetched_at_ms, p.now_ms), esc(ts(u.fetched_at_ms))));
    cards.push(card('RPC 源', d.rpc_sources_connected != null ? `${d.rpc_sources_connected}/${d.rpc_sources_configured}` : (h.rpc_connected != null ? (h.rpc_connected ? 'connected' : 'down') : '-'),
      `重连 ${fmtNum(d.rpc_reconnects_total ?? h.rpc_reconnects_total)}`, (d.rpc_connected ?? h.rpc_connected) ? 'ok' : 'bad'));
    cards.push(card('最新序号', fmtNum(u.latest_sequence), `最旧 ${fmtNum(d.event_ring_oldest_sequence ?? h.event_ring_oldest_sequence)}`));
    cards.push(card('最近广播', ago((d.last_broadcast_at_us ?? h.last_broadcast_at_us) / 1000, p.now_ms), `区块 ${fmtNum(d.latest_block ?? h.latest_block)}`));
    cards.push(card('事件', fmtNum(d.events_decoded_total ?? h.events_decoded_total), `重复 ${fmtNum(d.duplicates_total ?? h.duplicates_total)} · 解码错 ${fmtNum(d.decode_errors_total ?? h.decode_errors_total)}`));
    const hits = d.enrichment_recent_hits, tot = d.enrichment_recent_total;
    cards.push(card('富化命中', tot ? `${((hits / tot) * 100).toFixed(1)}%` : (d.enrichment_hits_total != null ? fmtNum(d.enrichment_hits_total) : '-'),
      `miss ${fmtNum(d.enrichment_misses_total ?? h.enrichment_misses_total)} · 市场 ${fmtNum(d.catalog_markets ?? h.catalog_markets)}`));
    cards.push(card('直连订阅者', fmtNum(d.subscribers ?? h.subscribers), `慢客户端 ${fmtNum(d.slow_clients_dropped_total ?? h.slow_clients_dropped_total)} · 帧 ${fmtNum(d.ws_frames_sent_total ?? h.ws_frames_sent_total)}`));
    if (Array.isArray(d.rpc_source_race)) {
      const race = d.rpc_source_race.map((r) => `${esc(r.source)} ${r.received ? ((r.won / r.received) * 100).toFixed(0) : 0}%`).join(' · ');
      cards.push(card('抢达率', race || '-', ''));
    }
    $('upstream').innerHTML = cards.join('');
  }

  function renderNodes(p) {
    const latest = (p.upstream && p.upstream.latest_sequence) || 0;
    const rows = p.nodes.map((n) => {
      const h = n.heartbeat;
      const lag = latest ? latest - h.last_event_sequence : null;
      const lagCls = lag == null ? 'dim' : lag <= 0 ? 'ok' : lag < 5 ? 'warn' : 'bad';
      const beat = p.now_ms - n.last_seen_ms;
      const flags = [n.disabled ? 'disabled' : '', n.desired_drain ? 'drain↓' : '', h.draining ? 'draining' : ''].filter(Boolean).join(' ');
      const actions = [
        `<button data-n="${esc(h.node_id)}" data-a="${n.desired_drain ? 'undrain' : 'drain'}">${n.desired_drain ? 'undrain' : 'drain'}</button>`,
        `<button data-n="${esc(h.node_id)}" data-a="${n.disabled ? 'enable' : 'disable'}">${n.disabled ? 'enable' : 'disable'}</button>`,
        `<button class="danger" data-n="${esc(h.node_id)}" data-a="forget">forget</button>`,
      ].join('');
      return `<tr>
        <td>${esc(h.node_id)}<div class="dim">${esc(n.remote_ip)}</div></td>
        <td><span class="badge ${statusClass(n.status)}">${esc(n.status)}</span>${flags ? `<div class="dim">${esc(flags)}</div>` : ''}</td>
        <td>${fmtNum(h.clients)}/${fmtNum(h.max_clients)}<div class="dim">拒 ${fmtNum(h.clients_rejected_total)}</div></td>
        <td class="${lagCls}">${lag == null ? '-' : lag}<div class="dim">seq ${fmtNum(h.last_event_sequence)}</div></td>
        <td>${fmtUs(h.upstream_lag_last_us)} / ${fmtUs(h.upstream_lag_max_us)}</td>
        <td>${fmtNum(h.frames_total)} / ${fmtBytes(h.bytes_total || 0)}<div class="dim">环 ${fmtNum(h.ring_frames)}/${fmtNum(h.ring_capacity)} · 坏帧 ${fmtNum(h.bad_frames_total)}</div></td>
        <td class="${h.slow_clients_disconnected_total ? 'warn' : ''}">${fmtNum(h.slow_clients_disconnected_total)}</td>
        <td>${fmtUs(h.fanout_max_us)}<div class="dim">last ${fmtUs(h.fanout_last_us)}</div></td>
        <td class="${h.upstream_connected ? 'ok' : 'bad'}">${h.upstream_connected ? 'up' : 'down'}<div class="dim">重连 ${fmtNum(h.upstream_reconnects_total)} · 帧 ${ago(h.last_frame_at_ms, p.now_ms)}</div></td>
        <td>${esc(n.url)}</td>
        <td class="dim">${esc(h.version)}<div>${esc(h.commit)}</div></td>
        <td class="${beat > p.stale_after_ms ? 'bad' : ''}">${(beat / 1000).toFixed(1)}s<div class="dim">tok v${h.tokens_version}</div></td>
        <td><input data-note="${esc(h.node_id)}" value="${esc(n.note)}" size="10" placeholder="备注"></td>
        <td>${actions}</td>
      </tr>`;
    });
    $('nodes').innerHTML = rows.join('') || '<tr><td colspan="14" class="empty">还没有节点心跳</td></tr>';
  }

  function renderTokens(p) {
    const rows = p.tokens.map((t) => {
      const dist = Object.entries(t.nodes || {}).map(([k, v]) => `${esc(k)}:${v}`).join(' ');
      return `<tr>
        <td>${esc(t.id)}</td><td>${esc(t.name)}</td><td class="dim">${esc(t.prefix)}…</td>
        <td><span class="badge ${t.enabled ? 'ok' : 'dim'}">${t.enabled ? 'enabled' : 'disabled'}</span></td>
        <td>${fmtNum(t.clients)}</td><td class="dim">${dist || '-'}</td><td class="dim">${esc(ts(t.created_at_ms))}</td>
        <td><button data-t="${esc(t.id)}" data-a="${t.enabled ? 'disable' : 'enable'}">${t.enabled ? 'disable' : 'enable'}</button>
            <button class="danger" data-t="${esc(t.id)}" data-a="delete">delete</button></td>
      </tr>`;
    });
    $('tokens').innerHTML = rows.join('') || '<tr><td colspan="8" class="empty">还没有 token</td></tr>';
  }

  async function admin(method, path, body) {
    const a = getAdmin();
    if (!a) { alert('先填 admin token'); return null; }
    const r = await fetch(path, { method, headers: { Authorization: 'Bearer ' + a, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { alert(`${method} ${path}: ${r.status} ${j.error || ''}`); return null; }
    return j;
  }

  document.addEventListener('click', async (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.n) {
      if (b.dataset.a === 'forget' && !confirm(`forget ${b.dataset.n}?`)) return;
      await admin('POST', `/api/v1/admin/nodes/${encodeURIComponent(b.dataset.n)}/${b.dataset.a}`);
      load();
    } else if (b.dataset.t) {
      if (b.dataset.a === 'delete') {
        if (!confirm(`delete token ${b.dataset.t}? 在线连接会被断开`)) return;
        await admin('DELETE', `/api/v1/admin/tokens/${encodeURIComponent(b.dataset.t)}`);
      } else {
        await admin('POST', `/api/v1/admin/tokens/${encodeURIComponent(b.dataset.t)}/${b.dataset.a}`);
      }
      load();
    }
  });
  document.addEventListener('change', async (e) => {
    const i = e.target.closest('input[data-note]');
    if (!i) return;
    await admin('PUT', `/api/v1/admin/nodes/${encodeURIComponent(i.dataset.note)}/note`, { note: i.value });
  });
  $('create').onclick = async () => {
    const name = $('newname').value.trim();
    if (!name) { alert('填一个名称'); return; }
    const j = await admin('POST', '/api/v1/admin/tokens', { name });
    if (!j) return;
    $('newname').value = '';
    $('secret').style.display = 'block';
    $('secret').innerHTML = `token <b>${esc(j.name)}</b>（id ${esc(j.id)}）的完整 secret 只显示这一次：<br><code>${esc(j.secret)}</code>`;
    load();
  };

  let busy = false;
  async function load() {
    if (busy) return;
    busy = true;
    try {
      const r = await fetch(`/api/v1/panel?token=${encodeURIComponent(token)}`, { cache: 'no-store' });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const p = await r.json();
      const c = p.console;
      $('meta').className = '';
      $('meta').textContent = `console ${c.version} (${c.commit}) · up ${Math.floor(c.uptime_s / 60)}m · serving ${c.serving_nodes}/${c.known_nodes} · ${ts(p.now_ms)} UTC`;
      renderUpstream(p); renderNodes(p); renderTokens(p);
    } catch (err) {
      $('meta').className = 'err';
      $('meta').textContent = `加载失败：${err.message}（需要 ?token=）`;
    } finally { busy = false; }
  }
  load();
  setInterval(load, 3000);
})();
</script>
</body>
</html>
