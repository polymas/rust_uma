<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rust-uma monitor</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0f14;
    --panel: #121821;
    --border: #1f2733;
    --text: #d8e1ea;
    --dim: #7c8a9a;
    --ok: #3ecf8e;
    --warn: #e8b339;
    --bad: #e5534b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    padding: 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 4px;
    color: var(--text);
    flex: 0 0 auto;
  }
  #meta { color: var(--dim); margin-bottom: 18px; font-size: 12px; flex: 0 0 auto; }
  #meta.err { color: var(--bad); }
  .grid {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .card h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--dim);
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex-shrink: 0; }
  .dot.ok { background: var(--ok); }
  .dot.bad { background: var(--bad); }
  .row {
    display: flex;
    justify-content: space-between;
    padding: 3px 0;
    border-bottom: 1px dashed var(--border);
  }
  .row:last-child { border-bottom: none; }
  .row .k { color: var(--dim); }
  .row .v { font-variant-numeric: tabular-nums; }
  .v.ok { color: var(--ok); }
  .v.warn { color: var(--warn); }
  .v.bad { color: var(--bad); }
  .events-card {
    margin-top: 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .events-card h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--dim);
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex: 0 0 auto;
  }
  .events-card h2 .hint { text-transform: none; letter-spacing: normal; font-weight: 400; }
  button.timetoggle {
    font: inherit;
    font-size: 11px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 3px 9px;
    cursor: pointer;
    flex: 0 0 auto;
  }
  button.timetoggle:hover { border-color: var(--dim); }
  .tablewrap { overflow: auto; flex: 1 1 auto; min-height: 0; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; white-space: nowrap; }
  th, td { text-align: left; padding: 4px 10px 4px 0; border-bottom: 1px dashed var(--border); }
  th { color: var(--dim); font-weight: 500; position: sticky; top: 0; background: var(--panel); }
  td.mono { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<h1>rust-uma 运行监控</h1>
<div id="meta">加载中…</div>
<div class="grid" id="grid"></div>

<div class="events-card">
  <h2>
    <span>实时推送 <span class="hint" id="wsStatus">（连接 WSS 中…）</span></span>
    <button class="timetoggle" id="timeToggle">切换为绝对时间</button>
  </h2>
  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th>序号</th><th>收到于</th><th>端到端延迟</th><th>类型</th><th>方向</th>
          <th>Market ID</th><th>Condition ID</th><th>Token IDs（粗体=方向指向）</th>
          <th>Tags</th><th>富化</th>
        </tr>
      </thead>
      <tbody id="eventsBody">
        <tr><td colspan="10" style="color:var(--dim)">等待新事件…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
// ---- 极简 protobuf wire 解码（只覆盖本项目 proto/uma.proto 用到的类型：
// varint 和 length-delimited，没有 fixed32/64、没有嵌套除 events 数组外的
// message）。避免引入 protobufjs 这种通用运行时。
function readVarint(buf, pos) {
  let result = 0, shift = 0, b;
  do {
    b = buf[pos.i++];
    result += (b & 0x7f) * Math.pow(2, shift);
    shift += 7;
  } while (b & 0x80);
  return result;
}
// 解出 {fieldNumber: [{wire:0,val:number}|{wire:2,bytes:Uint8Array}, ...]}
function decodeFields(buf) {
  const fields = {};
  const pos = { i: 0 };
  while (pos.i < buf.length) {
    const tag = readVarint(buf, pos);
    const fieldNo = tag >>> 3;
    const wireType = tag & 7;
    let entry;
    if (wireType === 0) {
      entry = { wire: 0, val: readVarint(buf, pos) };
    } else if (wireType === 2) {
      const len = readVarint(buf, pos);
      entry = { wire: 2, bytes: buf.subarray(pos.i, pos.i + len) };
      pos.i += len;
    } else {
      throw new Error("unsupported wire type " + wireType);
    }
    (fields[fieldNo] || (fields[fieldNo] = [])).push(entry);
  }
  return fields;
}
function toHex(bytes) {
  let s = "0x";
  for (let i = 0; i < bytes.length; i++) s += bytes[i].toString(16).padStart(2, "0");
  return s;
}

const EVENT_TYPE = { 0: "unspecified", 1: "propose", 2: "dispute" };
const ENRICHMENT_STATUS = { 0: "unspecified", 1: "hit", 2: "miss" };
// PRICE_OUTCOME_TOKEN0/1 map straight to token_ids[0]/[1] — see
// proto/uma.proto's UmaEvent.price_outcome doc comment for the derivation
// (UmaCtfAdapter.sol's payout formula) and why dispute events never carry one.
const PRICE_OUTCOME = { 0: "unspecified", 1: "token0", 2: "token1", 3: "tie" };

function decodeUmaEvent(buf) {
  const f = decodeFields(buf);
  const one = (n) => f[n] && f[n][0];
  const val = (n, d) => (one(n) ? one(n).val : d);
  const bytes = (n) => (one(n) ? one(n).bytes : new Uint8Array(0));
  const hex = (n) => toHex(bytes(n));
  const repeatedBytes = (n) => (f[n] || []).map((e) => toHex(e.bytes));
  // proto3 packs repeated scalar numeric fields by default (tag_ids here) —
  // prost sends one length-delimited entry containing back-to-back varints,
  // not one wire-type-0 entry per value. Unpack that; also accept the
  // unpacked form (repeated wire-type-0 entries) for robustness.
  const repeatedVal = (n) => {
    const out = [];
    for (const entry of f[n] || []) {
      if (entry.wire === 0) {
        out.push(entry.val);
      } else {
        const pos = { i: 0 };
        while (pos.i < entry.bytes.length) out.push(readVarint(entry.bytes, pos));
      }
    }
    return out;
  };
  return {
    sequence: val(1, 0),
    event_type: EVENT_TYPE[val(2, 0)] || "unspecified",
    transaction_hash: hex(3),
    log_index: val(4, 0),
    market_id: val(5, 0),
    condition_id: hex(6),
    token_ids: repeatedBytes(7),
    tag_ids: repeatedVal(8),
    upstream_received_at_us: val(9, 0),
    removed: !!val(10, 0),
    enrichment_status: ENRICHMENT_STATUS[val(11, 0)] || "unspecified",
    price_outcome: PRICE_OUTCOME[val(12, 0)] || "unspecified",
  };
}
function decodeUmaBatch(buf) {
  const f = decodeFields(buf);
  return (f[4] || []).map((e) => decodeUmaEvent(e.bytes));
}

// ---- 帧头（12 字节，见 internal/api/llms.txt）：
// 0..4 "UMA1" · 4 flags(bit0=zstd) · 5 schema版本 · 6..8 保留 · 8..12 未压缩大小(BE)
function decodeFrame(arrayBuffer) {
  const view = new Uint8Array(arrayBuffer);
  if (view.length < 12 || view[0] !== 0x55 || view[1] !== 0x4d || view[2] !== 0x41 || view[3] !== 0x31) {
    throw new Error("bad frame magic");
  }
  const flags = view[4];
  const useZstd = (flags & 1) !== 0;
  const payload = view.subarray(12);
  const raw = useZstd ? fzstd.decompress(payload) : payload;
  return decodeUmaBatch(raw);
}

const params = new URLSearchParams(location.search);
const token = params.get("token") || "";
const meta = document.getElementById("meta");
const grid = document.getElementById("grid");

let prev = null; // previous sample, for rate computation
let prevAt = 0;  // Date.now() of previous sample

function fmtBytes(n) {
  if (n < 1024) return n.toFixed(0) + " B";
  if (n < 1024*1024) return (n/1024).toFixed(1) + " KB";
  return (n/1024/1024).toFixed(2) + " MB";
}
function fmtRate(bytesPerSec) { return fmtBytes(bytesPerSec) + "/s"; }
function fmtAgo(us) {
  if (!us) return "从未";
  const ms = Date.now() - us / 1000;
  if (ms < 0) return "刚刚";
  if (ms < 1000) return ms.toFixed(0) + "ms 前";
  if (ms < 60000) return (ms/1000).toFixed(1) + "s 前";
  return (ms/60000).toFixed(1) + "min 前";
}
function fmtAbsolute(us) {
  if (!us) return "—";
  const d = new Date(us / 1000);
  return d.toLocaleTimeString(undefined, { hour12: false }) + "." + String(Math.floor(us / 1000) % 1000).padStart(3, "0");
}
function rate(curr, key, seconds) {
  if (!prev) return 0;
  const d = curr[key] - prev[key];
  return d > 0 ? d / seconds : 0;
}

function short(hex) { return hex && hex.length > 14 ? hex.slice(0, 8) + "…" + hex.slice(-6) : hex; }
function fmtDuration(us) {
  if (us < 1000) return us.toFixed(0) + "µs";
  if (us < 1_000_000) return (us / 1000).toFixed(1) + "ms";
  return (us / 1_000_000).toFixed(2) + "s";
}

const events = []; // newest-first, capped
const seenSeq = new Set();
const MAX_EVENTS = 60;
const eventsBody = document.getElementById("eventsBody");
const wsStatus = document.getElementById("wsStatus");
const timeToggle = document.getElementById("timeToggle");
let useAbsoluteTime = false;
timeToggle.addEventListener("click", () => {
  useAbsoluteTime = !useAbsoluteTime;
  timeToggle.textContent = useAbsoluteTime ? "切换为相对时间" : "切换为绝对时间";
  renderEvents();
});

const OUTCOME_LABEL = { token0: "买 Token0", token1: "买 Token1", tie: "50/50", unspecified: "—" };

// Polymarket tag id -> label. 纯客户端浏览器直接拉 Polymarket 自己的公开
// Gamma API（不经过本服务端，本服务端不做任何 tag 映射相关的事）。页面加载
// 时拉一次，浏览器生命周期内不变；limit=1000 一页拉全（目前约 150 个 tag，
// 该接口不提供分页游标）。拉取失败就留空对象，渲染时退化回显示原始数字 id。
let tagLabels = {};
async function loadTagLabels() {
  try {
    const res = await fetch("https://gamma-api.polymarket.com/tags?limit=1000", { cache: "no-store" });
    if (!res.ok) return;
    const list = await res.json();
    for (const tag of list) tagLabels[tag.id] = tag.label;
    renderEvents();
  } catch (e) {
    console.error("tag label fetch failed", e);
  }
}
loadTagLabels();

function renderEvents() {
  if (!events.length) return;
  const fmtTime = useAbsoluteTime ? fmtAbsolute : fmtAgo;
  eventsBody.innerHTML = events.map(ev => {
    const latencyUs = ev.received_at_client_us - ev.upstream_received_at_us;
    const latency = fmtDuration(latencyUs); // always a duration — absolute/relative toggle only affects "收到于"
    const winnerIdx = ev.price_outcome === "token0" ? 0 : ev.price_outcome === "token1" ? 1 : -1;
    const tokenIds = (ev.token_ids || []).map((id, i) =>
      i === winnerIdx ? `<b>${short(id)}</b>` : short(id)
    ).join("<br>") || "—";
    const tags = (ev.tag_ids || []).map((id) => tagLabels[id] || id).join(", ") || "—";
    return `
    <tr>
      <td>#${ev.sequence}</td>
      <td class="mono">${fmtTime(ev.upstream_received_at_us)}</td>
      <td class="mono" title="端到端：从上游收到日志到这个浏览器收到 WSS 帧，含服务器处理和网络传输">${latency}</td>
      <td class="${ev.event_type === 'dispute' ? 'bad' : ''}">${ev.event_type}</td>
      <td>${OUTCOME_LABEL[ev.price_outcome] || "—"}</td>
      <td>${ev.market_id}</td>
      <td title="${ev.condition_id}">${short(ev.condition_id)}</td>
      <td title="${(ev.token_ids || []).join(', ')}">${tokenIds}</td>
      <td>${tags}</td>
      <td class="${ev.enrichment_status === 'hit' ? 'ok' : 'warn'}">${ev.enrichment_status}</td>
    </tr>
  `;
  }).join("");
}

function connectWs() {
  const scheme = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(`${scheme}//${location.host}/uma/v1/ws`, ["uma.pb.v1"]);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { wsStatus.textContent = "（已连接）"; };
  ws.onclose = () => {
    wsStatus.textContent = "（断开，2s 后重连…）";
    setTimeout(connectWs, 2000);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = (msg) => {
    if (!(msg.data instanceof ArrayBuffer)) return; // ignore ping/pong text frames
    const receivedAt = Date.now() * 1000; // us, client wall clock
    let decoded;
    try {
      decoded = decodeFrame(msg.data);
    } catch (e) {
      console.error("frame decode failed", e);
      return;
    }
    let added = false;
    for (const ev of decoded) {
      if (seenSeq.has(ev.sequence)) continue; // at-least-once delivery — dedup
      ev.received_at_client_us = receivedAt;
      seenSeq.add(ev.sequence);
      events.unshift(ev);
      added = true;
    }
    if (events.length > MAX_EVENTS) {
      for (const dropped of events.splice(MAX_EVENTS)) seenSeq.delete(dropped.sequence);
    }
    if (added) renderEvents();
  };
}
connectWs();

function card(title, dotClass, rows) {
  const el = document.createElement("div");
  el.className = "card";
  const rowsHtml = rows.map(([k, v, cls]) =>
    `<div class="row"><span class="k">${k}</span><span class="v ${cls||''}">${v}</span></div>`
  ).join("");
  el.innerHTML = `<h2><span class="dot ${dotClass||''}"></span>${title}</h2>${rowsHtml}`;
  return el;
}

async function tick() {
  let data;
  try {
    const res = await fetch(`/uma/v1/dashboard-data?token=${encodeURIComponent(token)}`, { cache: "no-store" });
    if (res.status === 403) {
      meta.textContent = "token 无效或缺失 —— 在链接末尾加 ?token=xxx";
      meta.className = "err";
      return;
    }
    if (!res.ok) throw new Error("HTTP " + res.status);
    data = await res.json();
  } catch (e) {
    meta.textContent = "拉取失败：" + e.message + "（将自动重试）";
    meta.className = "err";
    return;
  }

  const now = Date.now();
  const seconds = prevAt ? (now - prevAt) / 1000 : 2;

  const rpcOk = data.rpc_connected;
  const wsBytesRate = rate(data, "rpc_bytes_received_total", seconds);
  const wsSendRate = rate(data, "ws_bytes_sent_total", seconds);
  const framesRate = rate(data, "ws_frames_sent_total", seconds);
  const logsRate = rate(data, "rpc_logs_received_total", seconds);
  const hitTotal = data.enrichment_hits_total + data.enrichment_misses_total;
  const hitPct = hitTotal ? (data.enrichment_hits_total / hitTotal * 100) : 100;

  meta.className = "";
  meta.textContent = `服务端时间 ${new Date(data.server_time_us/1000).toLocaleTimeString()} · 每 2s 刷新一次`;

  grid.innerHTML = "";
  grid.appendChild(card("RPC 上游收发", rpcOk ? "ok" : "bad", [
    ["连接状态", rpcOk ? "已连接" : "断开", rpcOk ? "ok" : "bad"],
    ["活跃源 / 配置源", `${data.rpc_sources_connected} / ${data.rpc_sources_configured}`],
    ["累计重连", data.rpc_reconnects_total, data.rpc_reconnects_total > 0 ? "warn" : ""],
    ["接收速率", fmtRate(wsBytesRate)],
    ["累计接收", fmtBytes(data.rpc_bytes_received_total)],
    ["累计发送", fmtBytes(data.rpc_bytes_sent_total)],
    ["日志接收速率", logsRate.toFixed(2) + " 条/s"],
    ["日志接收总数", data.rpc_logs_received_total],
    ["最新区块", data.latest_block],
  ]));

  grid.appendChild(card("富化 (Catalog)", hitPct > 95 ? "ok" : (hitPct > 80 ? "" : "bad"), [
    ["缓存市场数", data.catalog_markets],
    ["命中总数", data.enrichment_hits_total],
    ["其中 via market_id", data.enrichment_hits_via_market_id_total],
    ["未命中总数", data.enrichment_misses_total, data.enrichment_misses_total > 0 ? "warn" : ""],
    ["命中率", hitPct.toFixed(2) + "%", hitPct > 95 ? "ok" : (hitPct > 80 ? "warn" : "bad")],
    ["自愈补齐总数", data.catalog_reconcile_gaps_closed_total, data.catalog_reconcile_gaps_closed_total > 0 ? "warn" : ""],
  ]));

  grid.appendChild(card("热路径 / 事件处理", "", [
    ["已解码事件总数", data.events_decoded_total],
    ["解码错误总数", data.decode_errors_total, data.decode_errors_total > 0 ? "bad" : ""],
    ["去重丢弃总数", data.duplicates_total],
    ["事件环 (oldest→latest)", `#${data.event_ring_oldest_sequence} → #${data.event_ring_latest_sequence}`],
    ["最近一次上游收到", fmtAgo(data.last_upstream_received_at_us)],
    ["最近一次广播", fmtAgo(data.last_broadcast_at_us)],
    ["存储队列丢弃总数", data.storage_queue_dropped_total, data.storage_queue_dropped_total > 0 ? "warn" : ""],
  ]));

  grid.appendChild(card("下游 WSS 消费", data.subscribers > 0 ? "ok" : "", [
    ["当前连接数", data.subscribers],
    ["慢客户端断开总数", data.slow_clients_dropped_total, data.slow_clients_dropped_total > 0 ? "warn" : ""],
    ["下发速率", fmtRate(wsSendRate)],
    ["下发帧速率", framesRate.toFixed(2) + " 帧/s"],
    ["累计下发字节", fmtBytes(data.ws_bytes_sent_total)],
    ["累计下发帧数", data.ws_frames_sent_total],
  ]));

  prev = data;
  prevAt = now;
}

tick();
setInterval(tick, 2000);
</script>
</body>
</html>
