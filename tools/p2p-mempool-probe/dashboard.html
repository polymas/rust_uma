<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polygon 提交偏好监测</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1f1c; --muted: #6b6a62; --line: #e3e1d8;
  --accent: #2f6f5e; --good: #2f7d4f; --warn: #a8632a; --bad: #b23b3b; --neutral: #7d8b96; --chip: #eef0ea;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141614; --panel: #1c1f1c; --ink: #e8e7e1; --muted: #9a998f; --line: #2d312c;
    --accent: #6fbfa6; --good: #6fbf85; --warn: #d9a066; --bad: #e08585; --neutral: #9aa8b3; --chip: #262a26;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.55 -apple-system, "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif; }
header { padding: 20px 24px 6px; }
h1 { font-size: 19px; margin: 0; font-weight: 650; }
.sub { color: var(--muted); font-size: 12.5px; }
main { padding: 0 24px 40px; max-width: 1200px; margin: 0 auto; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 10px 0 16px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.kpi .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--muted); font-size: 12px; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
section h2 { font-size: 15px; margin: 0 0 10px; font-weight: 650; }
.hint { color: var(--muted); font-size: 12px; margin: -4px 0 12px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }
.muted { color: var(--muted); }
.badge { display: inline-block; padding: 1px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.g { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.w { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.b { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.n { background: color-mix(in srgb, var(--neutral) 18%, transparent); color: var(--neutral); }
.concl { list-style: none; margin: 0; padding: 0; }
.concl li { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--line); }
.concl li:last-child { border-bottom: none; }
.score { display: flex; align-items: center; gap: 8px; min-width: 150px; }
.score .bar { position: relative; flex: 1; height: 8px; background: var(--chip); border-radius: 4px; }
.score .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.score .bar b { position: absolute; left: 60%; top: -3px; width: 1px; height: 14px; background: var(--muted); }
.score .num { width: 30px; text-align: right; font-weight: 650; }
.pill { display: inline-block; background: var(--chip); border-radius: 6px; padding: 0 7px; margin: 1px 3px 1px 0; font-size: 12px; white-space: nowrap; }
.scroll { overflow-x: auto; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } header, main { padding-left: 16px; padding-right: 16px; } }
.err { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>Polygon 出块与 propose 提交偏好</h1>
  <div class="sub" id="status">正在取数据…</div>
</header>
<main>
  <div class="kpis" id="kpis"></div>

  <section>
    <h2>结论</h2>
    <ul class="concl" id="concl"></ul>
  </section>

  <section>
    <h2>节点评分</h2>
    <p class="hint">0–100 分，60 分及格（= 贡献达到 1%）。核心节点低于 60 分进入警戒，低于 42 分（贡献 &lt;0.7%）连续两小时会被降级；试用节点观察期满、分数垫底的会被淘汰。</p>
    <div id="seatCounts" class="sub" style="margin-bottom:10px"></div>
    <div class="scroll"><table id="seats"></table></div>
  </section>

  <div class="grid2">
    <section>
      <h2>主要提交地址</h2>
      <div class="scroll"><table id="senders"></table></div>
    </section>
    <section>
      <h2>最近的节点变动</h2>
      <div class="scroll"><table id="decisions"></table></div>
    </section>
  </div>
</main>

<script>
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const q = (p, extra = "") => `${p}?token=${encodeURIComponent(TOKEN)}${extra}`;
const pct = (x, d = 0) => x == null ? "–" : (x * 100).toFixed(d) + "%";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// 份额 → 0-100 分：1% = 60 分（及格线），0.7% = 42 分（降级线），10% 及以上 = 100 分。
function score(share) {
  if (share <= 0) return 0;
  if (share <= 0.01) return Math.round(share / 0.01 * 60);
  return Math.min(100, Math.round(60 + 40 * Math.log10(share / 0.01)));
}

// 一句话结论：每条候选偏好 → 人话
const TEXT = {
  "R|S": ["每个提交地址固定走同一个路由合约", "提交地址用哪个路由合约没有规律"],
  "T|S": ["每个提交地址的小费策略很固定", "提交地址的小费没有固定策略"],
  "V|S": ["少数固定地址专走私有通道", "是否走私有通道与地址无关"],
  "V|C": ["某些类别的事件更常走私有通道", "私有通道与事件类别无关"],
  "K|S": ["每个提交地址的交易总从固定的几个节点最先冒出来", "提交地址的入口节点不固定"],
  "K|S,C": ["同一地址的同类事件，最先出现的节点也固定", "同一地址同类事件的入口节点不固定"],
  "G|S": ["每个提交地址的入口地区固定", "提交地址的入口地区不固定"],
  "S|C": ["某类事件由固定的地址提交", "同一类事件由多家地址分着提交"],
  "O|S": ["有些地址明显更常抢跑失败", "抢跑失败与地址无关"],
  "O|V": ["公开和私有通道的成功率不同", "公开和私有通道的成功率差不多"],
  "A|S": ["提交地址偏好某个出块者（注意：可能只是因为出块者按时段轮换）", "提交地址不偏好某个出块者"],
  "A|V": ["私有交易集中到某个出块者", "私有交易在各出块者之间分布均匀"],
  "L|K": ["不同节点带来的领先时间有差异", "各节点带来的领先时间差不多"],
  "G|A": ["不同出块者的块从不同地区首发", "各出块者的块首发地区相同"],
  "N|A": ["不同出块者的块经不同网络首发", "各出块者的块经相同网络首发"],
  "K|A": ["不同出块者的块由不同节点首发", "各出块者的块由相同节点首发"],
};

function renderKpis(s) {
  const priv = s.shares.tx_V.find(r => r.key === "私有");
  const ok = s.shares.tx_O.find(r => r.key === "成功");
  const top = s.shares.block_A[0];
  const region = s.shares.block_G[0];
  const k = [
    [top ? esc(top.label.split(" ").slice(0, 2).join(" ")) : "–", "当前主出块者（份额 " + (top ? pct(top.p) : "–") + "）"],
    [region ? esc(region.label.split("/")[0]) : "–", "新块主要从这里首发（" + (region ? pct(region.p) : "–") + "）"],
    [priv ? pct(priv.p) : "–", "走私有通道的 propose"],
    [ok ? pct(ok.p) : "–", "propose 交易最终成功上链"],
    [s.txs.toLocaleString(), "累计分析的 propose 交易"],
  ];
  document.getElementById("kpis").innerHTML = k.map(([v, l]) => `<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");
}

function renderConcl(s) {
  const rows = s.edges.map(e => {
    const t = TEXT[e.name] || [e.meaning, e.meaning];
    if (e.verdict === "成立" || e.verdict === "倾向成立") return [0, `<span class="badge g">成立</span>`, t[0]];
    if (e.verdict === "无关") return [1, `<span class="badge n">不成立</span>`, t[1]];
    return [2, `<span class="badge w">待定</span>`, t[0] + "？数据还不够"];
  }).sort((a, b) => a[0] - b[0]);
  document.getElementById("concl").innerHTML = rows.map(([, b, t]) => `<li>${b}<span>${esc(t)}</span></li>`).join("");
}

function seatVerdict(r, sc) {
  if (r.state === "cooldown") return ["b", "已淘汰，冷却中"];
  if (r.state === "lost") return ["w", "核心，暂时断开"];
  if (r.state === "candidate") return ["n", "候选"];
  if (r.state === "explore") return ["n", "探索中"];
  if (r.state === "trial" && (r.minutes || 0) < 120) return ["n", "试用观察中"];
  if (sc >= 60) return ["g", r.state === "core" ? "合格" : "合格，将晋升核心"];
  if (r.state === "core") return sc >= 42 ? ["w", "警戒"] : ["b", "可能被降级"];
  return ["b", "可能被淘汰"];
}

function renderSeats(s) {
  const t = s.seats;
  if (!t) return;
  const zh = { core: "核心", trial: "试用", explore: "探索", lost: "失联", cooldown: "冷却", candidate: "候选" };
  document.getElementById("seatCounts").innerHTML = Object.entries(t.counts).map(([k, v]) => `<span class="pill">${zh[k] || k} ${v}</span>`).join("");
  const rows = t.rows.filter(r => r.state !== "candidate").map(r => ({ ...r, sc: score(Math.max(r.a, r.b, r.c)) }));
  const order = { core: 0, lost: 1, trial: 2, explore: 3, cooldown: 4 };
  rows.sort((a, b) => (order[a.state] - order[b.state]) || (b.sc - a.sc));
  const color = sc => sc >= 60 ? "var(--good)" : sc >= 42 ? "var(--warn)" : "var(--bad)";
  document.getElementById("seats").innerHTML = `<tr><th>节点</th><th>位置</th><th>席位</th><th>分数</th><th>结论</th></tr>` +
    rows.map(r => {
      const [cls, txt] = seatVerdict(r, r.sc);
      const bar = r.state === "cooldown" ? `<span class="muted">–</span>` :
        `<div class="score"><div class="bar"><i style="width:${r.sc}%;background:${color(r.sc)}"></i><b></b></div><span class="num">${r.sc}</span></div>`;
      return `<tr><td class="mono">${esc(r.id.slice(0, 8))} <span class="muted">${esc((r.name || "").slice(0, 16))}</span></td>
        <td>${esc(r.where)}</td><td>${zh[r.state] || r.state}</td><td>${bar}</td><td><span class="badge ${cls}">${txt}</span></td></tr>`;
    }).join("");
  document.getElementById("decisions").innerHTML = `<tr><th>时间</th><th>节点</th><th>变动</th></tr>` +
    (t.decisions.length ? t.decisions.map(d => d.kind === "explore_report"
      ? `<tr><td colspan="3">保底探索：精选之外漏看 ${pct(d.miss_ratio_propose, 1)}${d.alert ? ` <span class="badge b">超过 1%</span>` : ` <span class="badge g">正常</span>`}</td></tr>`
      : `<tr><td class="muted">${d.at_us ? new Date(d.at_us / 1000).toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : ""}</td>
         <td class="mono">${esc(d.id.slice(0, 8))}</td><td>${zh[d.from] || d.from} → ${zh[d.to] || d.to}<div class="muted">${esc(d.reason)}</div></td></tr>`).join("")
      : `<tr><td colspan="3" class="muted">还没有变动（每小时评估一次）</td></tr>`);
}

function renderSenders(s) {
  document.getElementById("senders").innerHTML = `<tr><th>地址</th><th>份额</th><th>成功率</th><th>特点</th></tr>` +
    s.senders.slice(0, 10).map(x => {
      const tags = [];
      if (x.private != null && x.private > 0.5) tags.push(`<span class="badge w">走私有通道</span>`);
      if (x.success != null && x.success < 0.5) tags.push(`<span class="badge b">常抢跑失败</span>`);
      if (x.success != null && x.success >= 0.95) tags.push(`<span class="badge g">稳定</span>`);
      if (x.K && x.K[0] && x.K[0].p >= 0.4) tags.push(`<span class="pill">入口 ${esc(x.K[0].label.split(" ").slice(1, 2).join(""))}</span>`);
      return `<tr><td class="mono">${x.key.slice(0, 10)}…</td><td>${pct(x.share)}</td><td>${pct(x.success)}</td><td>${tags.join("") || "–"}</td></tr>`;
    }).join("");
}

async function load() {
  try {
    const r = await fetch(q("/api/snapshot"));
    if (r.status === 401) { document.getElementById("status").innerHTML = `<span class="err">需要在地址后加 ?token=…</span>`; return; }
    const s = await r.json();
    if (!s.edges) { document.getElementById("status").textContent = "监测刚启动，等待第一份快照…"; return; }
    document.getElementById("status").textContent = `更新于 ${new Date(s.t * 1000).toLocaleString("zh-CN")} · 每分钟自动刷新`;
    renderKpis(s); renderConcl(s); renderSeats(s); renderSenders(s);
  } catch (e) {
    document.getElementById("status").innerHTML = `<span class="err">加载失败：${esc(e.message)}</span>`;
  }
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
