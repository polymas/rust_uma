[package]
name = "rust-uma"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.11.1"
crc32fast = "1.5.0"
futures-util = "0.3.34"
hex = "0.4.3"
prost = "0.14.4"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha3 = "0.10.8"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
zstd = "0.13.3"

[build-dependencies]
prost-build = "0.14.4"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
