# 只反代运维监控面板需要的两个只读路径，其余一律 404 —— 生产 WSS/HTTP
# API（/uma/v1/ws 等）继续走 43.131.1.194:8011 直连，完全不经过这台 nginx，
# 不影响热路径延迟。
#
# 监听 8443 是因为 chainee.space 这个 zone 的 SSL/TLS 模式是 Full/Full
# strict，Cloudflare 代理（橙云）只会把回源流量发到它允许的 HTTPS 端口
# 列表（443/2053/2083/2087/2096/8443）之一，且必须是 HTTPS，不能是明文。
# 证书先用自签名顶一版验证链路（Full 模式下 Cloudflare 不校验源站证书链）；
# 如果 zone 实际是 Full strict，会收到 526 错误，需要换成 Cloudflare
# Origin CA 证书（SSL/TLS → Origin Server → Create Certificate）。
#
# 部署：
#   sudo cp deploy/dashboard.nginx.conf /etc/nginx/sites-available/dashboard
#   sudo ln -sf /etc/nginx/sites-available/dashboard /etc/nginx/sites-enabled/dashboard
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name tinyuma.chainee.space;

    ssl_certificate     /etc/nginx/dashboard-origin.crt;
    ssl_certificate_key /etc/nginx/dashboard-origin.key;

    location = /dashboard {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /uma/v1/dashboard-data {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 404;
    }
}
